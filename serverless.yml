service: reto-serverless
frameworkVersion: '3'

package:
  patterns:
    - '!java/**'
    - '!evento*.json'

provider:
  name: aws
  region: us-east-1
  environment:
    USERS_TABLE: ${self:service}-users-${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt UsersTable.Arn

functions:

  getUsers:
    runtime: nodejs20.x
    handler: node/getUsers.handler
    events:
      - httpApi:
          method: GET
          path: /users

  createUser:
    runtime: java21
    handler: co.srdejo.users.CreateUserHandler::handleRequest
    timeout: 29
    role: CreateUserRole
    package:
      artifact: java/build/libs/users-1.0.0.jar
    environment:
      QUEUE_URL: !Ref UsersQueue
    events:
      - httpApi:
          method: POST
          path: /users

  updateUser:
    runtime: nodejs20.x
    handler: node/updateUsers.handler
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

  deleteUser:
    runtime: java21
    handler: co.srdejo.users.DeleteUserHandler::handleRequest
    timeout: 29
    package:
      artifact: java/build/libs/users-1.0.0.jar
    events:
      - httpApi:
          method: DELETE
          path: /users/{id}

  enviarCorreos:
    runtime: nodejs20.x
    handler: node/enviarCorreos.handler
    role: EnviarCorreosRole
    environment:
      TOPIC_ARN: !Ref UsersTopic
    events:
      - sqs:
          arn: !GetAtt UsersQueue.Arn
          batchSize: 5

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    UsersQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-users-${sls:stage}
        VisibilityTimeout: 60
        SqsManagedSseEnabled: true

    UsersQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref UsersQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: SoloCreateUserEnvia
              Effect: Deny
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt UsersQueue.Arn
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn: !GetAtt CreateUserRole.Arn
            - Sid: SoloEnviarCorreosConsume
              Effect: Deny
              Principal: '*'
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:ChangeMessageVisibility
              Resource: !GetAtt UsersQueue.Arn
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn: !GetAtt EnviarCorreosRole.Arn

    UsersTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-correos-${sls:stage}

    UsersTopicSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref UsersTopic
        Protocol: email
        Endpoint: ${env:NOTIFY_EMAIL}

    UsersTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref UsersTopic
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: SoloEnviarCorreosPublica
              Effect: Deny
              Principal: '*'
              Action: sns:Publish
              Resource: !Ref UsersTopic
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn: !GetAtt EnviarCorreosRole.Arn

    CreateUserRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: create-user
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: dynamodb:PutItem
                  Resource: !GetAtt UsersTable.Arn
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource: !GetAtt UsersQueue.Arn

    EnviarCorreosRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: enviar-correos
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ChangeMessageVisibility
                  Resource: !GetAtt UsersQueue.Arn
                - Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref UsersTopic
