service: reto-serverless
frameworkVersion: '3'

package:
  patterns:
    - '!java/**'
    - '!evento*.json'

provider:
  name: aws
  region: us-east-1
  environment:
    USERS_TABLE: ${self:service}-users-${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt UsersTable.Arn

functions:

  getUsers:
    runtime: nodejs20.x
    handler: node/getUsers.handler
    events:
      - httpApi:
          method: GET
          path: /users

  createUser:
    runtime: java21
    handler: co.srdejo.users.CreateUserHandler::handleRequest
    package:
      artifact: java/build/libs/users-1.0.0.jar
    events:
      - httpApi:
          method: POST
          path: /users

  updateUser:
    runtime: nodejs20.x
    handler: node/updateUsers.handler
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

  deleteUser:
    runtime: java21
    handler: co.srdejo.users.DeleteUserHandler::handleRequest
    package:
      artifact: java/build/libs/users-1.0.0.jar
    events:
      - httpApi:
          method: DELETE
          path: /users/{id}

resources:
  Resources:
    # Privada: sin políticas de recurso; solo el rol IAM de las lambdas puede acceder.
    # Solo se declara la clave (id); nombre y email son atributos sin esquema.
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
